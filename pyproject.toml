[project]
name = "t61codec"
version = "2.0.0"
description = "Python Codec for ITU T.61 Strings"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
license = { text = "MIT" }
readme = "README.rst"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]

[project.urls]
Homepage = "https://github.com/exhuma/t61codec"
Repository = "https://github.com/exhuma/t61codec"
Documentation = "https://t61codec.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t61codec"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sphinx>=8.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["t61codec"]
