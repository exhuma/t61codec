[project]
name = "t61codec"
version = "3.0.0"
description = "Python Codec for ITU T.61 Strings"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["t61", "t.61", "teletex", "codec", "encoding", "itu", "x500", "ldap", "asn1", "T61String"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/exhuma/t61codec"
Repository = "https://github.com/exhuma/t61codec"
Documentation = "https://exhuma.github.io/t61codec/"
Changelog = "https://github.com/exhuma/t61codec/blob/master/CHANGES.rst"
Issues = "https://github.com/exhuma/t61codec/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t61codec"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sphinx>=8.0",
    "michel-albert-sphinx @ git+https://github.com/exhuma/michel-albert-sphinx@v0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["t61codec"]
